<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liminal</title>
    <link rel="stylesheet" href="style.css" />
    <script
      async
      src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
          "three/addons/controls/PointerLockControls.js": "https://unpkg.com/three@0.159.0/examples/jsm/controls/PointerLockControls.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="start-screen">
      <h1>LIMINAL</h1>
      <div id="enemy-select">
        <h2>Choose Your Enemy</h2>
        <div id="enemy-options">
          <div class="enemy-option">
            <label for="custom-enemy" class="upload-label">
              <img
                src="assets\imageIcon.svg"
                class="enemy-img upload-preview"
                alt="Upload Preview"
              />
              <span>Click to Upload Custom PNG</span>
            </label>
            <input
              type="file"
              id="custom-enemy"
              accept="image/png,image/jpeg"
              class="file-input"
            />
          </div>
        </div>
      </div>
      <button id="start-button" type="button">Enter the Void</button>
    </div>
    <div id="game-container" style="display: none">
      <div id="instructions" class="hidden">
        <p>Move: WASD / Arrow Keys</p>
        <p>Look: Mouse</p>
        <p>Click to continue</p>
      </div>
      <canvas id="gameCanvas"></canvas>
      <div id="hud">
        <div id="player-health">Health: 100</div>
        <div id="fps-counter">FPS: 0</div>
      </div>
    </div>
    <script type="module" src="js/game.js"></script>
    <script type="module" src="js/textureDebugger.js"></script>
  </body>
</html>
